				"$(SRCROOT)/../engine/build/$(SPK_ENGINE_DIR)/spektrafilm.metallib",
			);
			name = "Copy the engine's resources and kernels, and the licences";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/engine/spektrafilm.metallib",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# The engine's resources and its kernels, in ONE step, so nothing else ever\n# writes SpektraProbe.app/engine. They used to be two -- a folder-reference copy\n# of Resources/engine in the Resources phase, and this phase adding the metallib\n# -- and Xcode may run those side by side: when the folder copy landed last it\n# replaced the folder and the metallib was gone (\"the engine is not running\").\n# The kernels differ per platform (engine/build-ios.sh: device build/ios,\n# Simulator build/ios-sim), so they are never in Resources/engine.\nsrc=\"${SRCROOT}/Resources/engine\"\nlib=\"${SRCROOT}/../engine/build/${SPK_ENGINE_DIR}/spektrafilm.metallib\"\ndst=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/engine\"\nif [ ! -f \"$src/spektrafilm_constants.bin\" ]; then\n  echo \"error: $src is missing. Run engine/build-ios.sh bundle.\"\n  exit 1\nfi\nif [ ! -f \"$lib\" ]; then\n  echo \"error: $lib is missing. Run engine/build-ios.sh (device) or engine/build-ios.sh sim (Simulator).\"\n  exit 1\nfi\nmkdir -p \"$dst\"\nrsync -a --delete --exclude spektrafilm.metallib \"$src/\" \"$dst/\"\ncp \"$lib\" \"$dst/spektrafilm.metallib\"\n# The licence texts the app must carry (Licences.swift shows them), copied from\n# the repository's own copies so they cannot drift from the code they cover.\nlic=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Licenses\"\nrepo=\"${SRCROOT}/..\"\nmkdir -p \"$lic\"\ncp \"${SRCROOT}/SpektraProbe/Licenses/README.txt\" \"$lic/README.txt\"\ncp \"$repo/license/LICENSE\" \"$lic/GPL-3.0.txt\"\ncp \"$repo/license/SPEKTRAFILM_LICENSE.txt\" \"$lic/Profiles-and-LUTs-CC-BY-SA-4.0.txt\"\ncp \"$repo/modern_UI/Spektrafilm/Spektrafilm/Resources/Licenses/Profiles-and-LUTs-CHANGELOG.txt\" \"$lic/Profiles-and-LUTs-CHANGELOG.txt\"\ncp \"$repo/engine/third_party/metal-cpp/LICENSE.txt\" \"$lic/metal-cpp-Apache-2.0.txt\"\n";
		};
